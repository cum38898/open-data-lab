name: subsidy-finder

on:
  schedule:
    - cron: "17 20 * * *" # 毎日 05:17（日本時間）にデータを取り直して公開
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "subsidy-finder/**"
      - ".github/workflows/subsidy-finder.yml"
  pull_request:
    paths:
      - "subsidy-finder/**"
      - ".github/workflows/subsidy-finder.yml"

permissions:
  contents: read

concurrency:
  group: subsidy-finder-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: subsidy-finder

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: subsidy-finder/site/package-lock.json
      - name: ETL tests
        run: python -m unittest discover -s etl/tests -t .
      - name: Install site dependencies
        run: npm ci
        working-directory: subsidy-finder/site
      - name: Site tests
        run: npm test
        working-directory: subsidy-finder/site
      - name: Build site from committed data
        run: |
          python -m etl.build --offline
          npm run build --prefix site

  update-and-deploy:
    # main への push・定期実行・手動実行のときだけ公開する（PR では公開しない）
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # 取得したデータのキャッシュをコミットする
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: subsidy-finder/site/package-lock.json

      - name: Fetch latest data
        if: github.event_name != 'push'
        run: python -m etl.build
      - name: Use committed data
        if: github.event_name == 'push'
        run: python -m etl.build --offline

      - name: Commit updated data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jgrants.json data/hokkaido_pref.json
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "data: 補助金データを更新（$(TZ=Asia/Tokyo date +%F)）"
            git push
          fi

      - id: pages
        uses: actions/configure-pages@v5
      - name: Build site
        run: |
          npm ci
          npm run build
        working-directory: subsidy-finder/site
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: subsidy-finder/site/dist
      - id: deployment
        uses: actions/deploy-pages@v4
